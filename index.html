<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naruto Akinator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d1b;color:#f4f5ff;font-family:Arial,sans-serif;padding:20px}
main{max-width:560px;margin:auto}
.card{background:#171d33;border:1px solid #343d60;border-radius:20px;padding:22px;margin:16px 0}
h1{text-align:center;color:#ff9d42}
.sub{text-align:center;color:#b9c4e8}
.badge{color:#ffbb70;font-size:13px}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;background:#ff8a30;color:#17101a;font-size:16px;font-weight:bold;cursor:pointer}
button.alt{background:#303b60;color:white}
button:disabled{opacity:.5}
#question{font-size:23px;line-height:1.4}
#progress{height:7px;background:#303750;border-radius:9px;overflow:hidden;margin:15px 0}
#bar{height:100%;width:0;background:#ff8a30;transition:width .2s}
.small{font-size:13px;color:#bdc7e5}
</style>
</head>
<body>
<main>
<h1>🍥 Naruto Akinator</h1>
<p class="sub">Think of a Naruto character. I'll try to guess!</p>
<div class="card">
<div class="badge" id="status">READY TO PLAY</div>
<div id="progress"><div id="bar"></div></div>
<h2 id="question">Ready to test your Naruto knowledge?</h2>
<div id="answers">
<button onclick="startGame()">▶ Start Game</button>
</div>
<p class="small" id="hint">100 characters • Adaptive questions • New starting question each round</p>
</div>
</main>

].map(c=>({name:c[0],village:c[1],gender:c[2],role:c[3],hair:c[4],special:c[5],ninja:c[6]}));

const questions=[
{key:"village",text:"Is your character from the Hidden Leaf Village?",test:c=>c.village==="Leaf"},
{key:"village",text:"Is your character connected to the Akatsuki?",test:c=>c.village==="Akatsuki"},
{key:"village",text:"Is your character from the Sand Village?",test:c=>c.village==="Sand"},
{key:"village",text:"Is your character from the Mist Village?",test:c=>c.village==="Mist"},
{key:"gender",text:"Is your character female?",test:c=>c.gender==="female"},
{key:"gender",text:"Is your character male?",test:c=>c.gender==="male"},
{key:"role",text:"Is your character mainly a villain?",test:c=>c.role==="villain"},
{key:"role",text:"Is your character a mentor or teacher?",test:c=>c.role==="mentor"},
{key:"role",text:"Is your character usually a hero or ally?",test:c=>c.role==="hero"},
{key:"role",text:"Is your character more of an antihero?",test:c=>c.role==="antihero"},
{key:"hair",text:"Does your character have blond or yellow hair?",test:c=>c.hair==="blond"},
{key:"hair",text:"Does your character have red hair?",test:c=>c.hair==="red"},
{key:"hair",text:"Does your character have white, silver, or gray hair?",test:c=>["white","silver","gray"].includes(c.hair)},
{key:"special",text:"Does your character have a special power or transformation?",test:c=>c.special==="yes"},
{key:"ninja",text:"Is your character a ninja?",test:c=>c.ninja==="yes"}
];

let candidates=[],asked=[],firstHistory="",round=0,current=null;
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startGame(){
 candidates=[...raw];asked=[];round++;
 $("status").textContent="ROUND "+round+" • "+candidates.length+" CHARACTERS LEFT;
 $("hint").textContent="Answer honestly, or choose Don't know.";
 $("bar").style.width="0%";
 const starts=shuffle(questions.filter(q=>q.text!==firstHistory));
 current=starts[0]||questions[0];firstHistory=current.text;
 showQuestion();
}
function showQuestion(){
 $("status").textContent="QUESTION "+(asked.length+1)+" • "+candidates.length+" POSSIBLE";
 $("question").textContent=current.text;
 $("answers").innerHTML="";
 ["Yes","No","Don't know"].forEach((label,i)=>{
  const b=document.createElement("button");
  b.textContent=label;
  if(i===2)b.className="alt";
  b.onclick=()=>answer(i===0?true:i===1?false:null);
  $("answers").appendChild(b);
 });
 $("bar").style.width=Math.min(100,asked.length/8*100)+"%";
}
function answer(value){
 if(value!==null)candidates=candidates.filter(c=>current.test(c)===value);
 asked.push(current.text);
 if(candidates.length<=1||asked.length>=12){showGuess();return}
 const available=questions.filter(q=>!asked.includes(q.text));
 if(!available.length){showGuess();return}
 // Pick the question that best splits the remaining characters.
 let best=[],bestScore=-1;
 for(const q of available){
  const yes=candidates.filter(q.test).length;
  const no=candidates.length-yes;
  if(yes===0||no===0)continue;
  const score=Math.min(yes,no);
  if(score>bestScore){bestScore=score;best=[q]}
  else if(score===bestScore)best.push(q);
 }
 if(!best.length){showGuess();return}
 current=shuffle(best)[0];
 showQuestion();
}
function showGuess(){
 $("bar").style.width="100%";
 $("status").textContent="MY GUESS";
 $("question").textContent=candidates.length
  ? "Is your character "+candidates[0].name+"?"
  : "I couldn't find a match! Try another round.";
 $("answers").innerHTML="";
 if(candidates.length){
  const yes=document.createElement("button");
  yes.textContent="Yes, that's right!";
  yes.onclick=()=>finish("🎉 I guessed it! Play again?");
  $("answers").appendChild(yes);
  const no=document.createElement("button");
  no.textContent="No, try again";
  no.className="alt";
  no.onclick=()=>{candidates.shift();showGuess()};
  $("answers").appendChild(no);
 }
 const again=document.createElement("button");
 again.textContent="↻ Play Again — New Question";
 again.className="alt";
 again.onclick=startGame;
 $("answers").appendChild(again);
 $("hint").textContent="Guesses are based on the answers you gave.";
}
function finish(message){
 $("status").textContent="NARUTO AKINATOR";
 $("question").textContent=message;
 $("answers").innerHTML="";
 const b=document.createElement("button");
 b.textContent="↻ Play Again — New Question";
 b.onclick=startGame;
 $("answers").appendChild(b);
}

</script>
</body>
</html>
